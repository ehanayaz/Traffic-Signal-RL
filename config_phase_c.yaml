# Phase C — 2×3 grid (six TLS), asymmetric link spacing (see phase_c_plain.nod.xml → phase_c.net.xml).
# Independent Double DQN per TLS (IDQN); observation/action sizes may differ by junction (corners vs mid-block).

paths:
  net_file: "phase_c.net.xml"
  route_file: "phase_c.rou.xml"
  # Written by SUMO each simulation end; used for progression-oriented validation metrics.
  tripinfo_output: "runs/phase_c_tripinfo.xml"

env:
  num_seconds: 1500
  delta_time: 5
  yellow_time: 4
  min_green: 10
  waiting_time_memory: 1000
  max_depart_delay: 0
  sumo_warnings: false
  reward_fn: "diff-waiting-time"
  sumo_seed: 42

training:
  episodes: 120
  lr: 0.001
  gamma: 0.99
  batch_size: 128
  max_memory: 100000
  max_grad: 1.0
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  target_update_tau: 0.05
  target_sync_steps: 500
  hidden_size: 128

validation:
  every_episodes: 10
  episodes: 3

# Extra metrics (trip duration mean / p95 from SUMO tripinfo) — complements system mean wait for progression.
progression:
  tripinfo: true

outputs:
  log_csv: "runs/phase_c_train.csv"
  summary_json: "runs/phase_c_summary.json"
  checkpoint_dir: "checkpoints/phase_c"
